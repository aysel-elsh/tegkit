[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tegkit"
version = "0.1.0"
description = "Small, dependency-free toolkit for modelling thermoelectric generators (TEGs)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Aysel Elshenawy" }]
requires-python = ">=3.9"
keywords = ["thermoelectric", "TEG", "seebeck", "energy harvesting", "waste heat", "peltier"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Education",
  "Topic :: Scientific/Engineering :: Physics",
  "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/aysel-elsh/tegkit"
Issues = "https://github.com/aysel-elsh/tegkit/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
